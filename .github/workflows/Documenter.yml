name: Documenter

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:

# Master and tag builds both update gh-pages; never deploy them concurrently.
# Keep queued releases, and let PR builds run independently of deployments.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('documenter-pr-{0}', github.event.pull_request.number) || 'documenter-gh-pages' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - uses: julia-actions/cache@v3

      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
