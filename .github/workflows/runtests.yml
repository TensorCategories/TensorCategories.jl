name: Runtests
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel outdated automatic runs without interrupting a manual release check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      TENSORCATEGORIES_TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'quick' }}
    strategy:
      matrix:
        julia-version: ['1.11', '1.12']
        julia-arch: [x64]
        os: [ubuntu-latest, macOS-latest] # [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          coverage: ${{ env.TENSORCATEGORIES_TEST_SUITE == 'full' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: env.TENSORCATEGORIES_TEST_SUITE == 'full'
      - uses: codecov/codecov-action@v5
        if: env.TENSORCATEGORIES_TEST_SUITE == 'full'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
